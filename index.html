<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WatchGuide – Know what to watch</title>
    <meta name="description" content="Track every movie and show, and find your next favorite. Tonight picks, every rating at a glance, StreamQ and theme packs. Ad-free on iPhone, iPad and Apple TV.">
    <meta name="theme-color" content="#0b0920">
    <meta property="og:title" content="WatchGuide – Know what to watch">
    <meta property="og:description" content="Track every movie and show. Find your next favorite.">
    <meta property="og:image" content="https://watchguide.app/img/og.jpg">
    <meta property="og:url" content="https://watchguide.app">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="apple-itunes-app" content="app-id=6758427085">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0920;
            --bg-deep: #07061a;
            --indigo: #3a2e8c;
            --coral: #f2865a;
            --peach: #ffc49a;
            --amber: #ffa53a;
            --muted: #a9a4c9;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .text-coral {
            background: linear-gradient(100deg, var(--peach) 0%, var(--coral) 55%, #e8664a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-stage {
            background:
                radial-gradient(ellipse 80% 55% at 50% 0%, rgba(98, 76, 214, 0.45) 0%, rgba(11, 9, 32, 0) 70%),
                var(--bg-deep);
        }
        /* Projector beam, borrowed from the app icon */
        .beam {
            position: absolute;
            left: 50%;
            top: 30%;
            width: min(1100px, 140vw);
            height: 900px;
            transform: translateX(-50%);
            background: radial-gradient(ellipse 50% 60% at 50% 30%, rgba(242, 134, 90, 0.28) 0%, rgba(242, 134, 90, 0) 70%);
            filter: blur(40px);
            pointer-events: none;
        }
        .glass {
            background: rgba(22, 19, 52, 0.62);
            -webkit-backdrop-filter: saturate(160%) blur(22px);
            backdrop-filter: saturate(160%) blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .phone {
            background: #121024;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08),
                0 40px 80px -20px rgba(0,0,0,0.75),
                0 0 60px -10px rgba(98, 76, 214, 0.35);
        }
        .reveal { opacity: 0; transform: translateY(28px); transition: opacity .9s cubic-bezier(.16,.84,.44,1), transform .9s cubic-bezier(.16,.84,.44,1); }
        .reveal.in { opacity: 1; transform: none; }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .reveal { opacity: 1; transform: none; transition: none; }
        }
        .no-scrollbar { scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        ::selection { background-color: var(--coral); color: #fff; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
